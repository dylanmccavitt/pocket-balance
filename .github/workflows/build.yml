name: Build native plugins
on:
  workflow_dispatch:
  push:
    paths:
      - 'Source/**'
      - 'Tests/**'
      - 'FLStudio/**'
      - 'CMakeLists.txt'
      - 'scripts/**'
      - 'LICENSE'
      - 'THIRD_PARTY.md'
      - '.github/workflows/build.yml'
  pull_request:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure Mac universal
        if: runner.os == 'macOS'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64' -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
      - name: Configure Windows x64
        if: runner.os == 'Windows'
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release --parallel 3
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Test FL companion
        run: python -B -m unittest discover -s Tests -p '*SourceSync*.py'
      - name: Package plugins and corresponding source
        run: python scripts/Package.py --build build --output package
      - uses: actions/upload-artifact@v4
        with:
          name: Pocket-Balance-${{ matrix.os }}
          path: package/
